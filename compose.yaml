x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.0}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DATABASE:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DATABASE:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    BACKEND_HEALTH_URL: ${BACKEND_HEALTH_URL:-http://backend:3000/api/health}
    # Bases métier Homepedia — host/port via .env (défaut = conteneurs locaux).
    POSTGIS_HOST: ${POSTGIS_HOST:-postgis}
    POSTGIS_PORT: ${POSTGIS_PORT:-${POSTGIS_PUBLISH_PORT:-5432}}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    POSTGRES_DB: ${POSTGRES_DB:-homepedia}
    CADASTRE_DOWNLOAD_DIR: /opt/airflow/data/cadastre
    ATMO_USERNAME: ${ATMO_USERNAME:-}
    ATMO_PASSWORD: ${ATMO_PASSWORD:-}
    ATMO_DOWNLOAD_DIR: /opt/airflow/data/air_quality
    ATMO_AASQA_CODES: ${ATMO_AASQA_CODES:-01,02,03,04,06,11,24,27,28,32,44,52,53,75,76,84,93,94}
    ATMO_WINDOW_DAYS: ${ATMO_WINDOW_DAYS:-31}
    MONGODB_HOST: ${MONGODB_HOST:-mongodb}
    MONGODB_PORT: ${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}
    AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGIS_HOST:-postgis}:${POSTGIS_PORT:-${POSTGIS_PUBLISH_PORT:-5432}}/${POSTGRES_DB:-homepedia}
    AIRFLOW_CONN_MONGO_DEFAULT: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-example}@${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}/${MONGO_DATABASE:-homepedia}?authSource=admin
    MONGODB_URL: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-example}@${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}/${MONGO_DATABASE:-homepedia}?authSource=admin
    SCRAPERS_DIR: /opt/airflow/scrapers
    SITEMAP_URL: ${SITEMAP_URL:-https://www.bien-dans-ma-ville.fr/sitemap-villeavis.xml}
    DELAY_MS: ${SCRAPER_DELAY_MS:-800}
    WORKERS: ${SCRAPER_WORKERS:-4}
    SENTIMENT_BATCH_SIZE: ${SENTIMENT_BATCH_SIZE:-64}
    SENTIMENT_MAX_LENGTH: ${SENTIMENT_MAX_LENGTH:-256}
    DVF_LINK_PLOTS: ${DVF_LINK_PLOTS:-1}
    SENTIMENT_TORCH_THREADS: ${SENTIMENT_TORCH_THREADS:-0}
    SENTIMENT_MODEL: ${SENTIMENT_MODEL:-nlptown/bert-base-multilingual-uncased-sentiment}
    WORDCLOUD_METHOD: ${WORDCLOUD_METHOD:-count}
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pymongo>=4.8.0 ijson}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/data:/opt/airflow/data
    - ./scrapers:/opt/airflow/scrapers
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
    airflow-redis:
      condition: service_healthy
    postgis:
      condition: service_healthy

services:
  postgis:
    image: ${POSTGIS_IMAGE:-postgis/postgis:18-3.6-alpine}
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    ports:
      - ${POSTGIS_PUBLISH_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-homepedia}
    volumes:
      - postgis_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-homepedia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: ${MONGODB_IMAGE:-mongo:8.2}
    ports:
      - ${MONGODB_PUBLISH_PORT:-27017}:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-homepedia}
      GLIBC_TUNABLES=glibc.pthread.rseq: 1
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u ${MONGO_USERNAME:-root} -p ${MONGO_PASSWORD:-example} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .docker/node
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run start:dev"
    ports:
      - ${BACKEND_PORT:-3000}:3000
    environment:
      NODE_ENV: development
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGIS_HOST:-postgis}:${POSTGIS_PORT:-${POSTGIS_PUBLISH_PORT:-5432}}/${POSTGRES_DB:-homepedia}
      MONGODB_URL: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-example}@${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}/${MONGO_DATABASE:-homepedia}?authSource=admin
    volumes:
      - ./backend/:/usr/share/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .docker/node
      dockerfile: Dockerfile
    command: sh -c "printf \"window.__env = window.__env || {};\\nwindow.__env.MAPBOX_TOKEN = '%s';\\n\" \"${MAPBOX_TOKEN}\" > public/env.js && npm install && npm run start"
    ports:
      - ${FRONTEND_PORT:-4200}:4200
    environment:
      NODE_ENV: development
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    volumes:
      - ./frontend/:/usr/share/app
    depends_on:
      backend:
        condition: service_healthy

  airflow-postgres:
    image: ${AIRFLOW_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${AIRFLOW_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DATABASE:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_USER:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    # restart: always

  airflow-redis:
    image: ${AIRFLOW_REDIS_IMAGE:-redis:7.2}
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    # restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - ${AIRFLOW_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    build:
      context: .
      dockerfile: .docker/airflow-worker/Dockerfile
    image: homepedia-airflow-worker
    group_add:
      - "${DOCKER_GID:-989}"
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    # restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID}:0" /opt/airflow
        ls -la /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:?Set _AIRFLOW_WWW_USER_USERNAME in .env before starting Airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?Set _AIRFLOW_WWW_USER_PASSWORD in .env before starting Airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    command:
      - bash
      - -c
      - airflow
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"

  bdmv-scraper:
    image: python:3.12-slim
    working_dir: /app
    profiles:
      - scrapers
    environment:
      MONGODB_URL: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-example}@${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}/${MONGO_DATABASE:-homepedia}?authSource=admin
      SITEMAP_URL: ${SITEMAP_URL:-https://www.bien-dans-ma-ville.fr/sitemap-villeavis.xml}
      DRY_RUN: "0"
    volumes:
      - ./scrapers/bien-dans-ma-ville:/app
    command:
      - sh
      - -c
      - pip install --no-cache-dir -r requirements.txt && python scraper.py

  nlp-processor:
    image: python:3.12-slim
    working_dir: /app
    profiles:
      - scrapers
    environment:
      MONGODB_URL: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-example}@${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}/${MONGO_DATABASE:-homepedia}?authSource=admin
      SENTIMENT_BATCH_SIZE: ${SENTIMENT_BATCH_SIZE:-64}
      SENTIMENT_MAX_LENGTH: ${SENTIMENT_MAX_LENGTH:-256}
      SENTIMENT_TORCH_THREADS: ${SENTIMENT_TORCH_THREADS:-0}
      SENTIMENT_MODEL: ${SENTIMENT_MODEL:-nlptown/bert-base-multilingual-uncased-sentiment}
      WORDCLOUD_METHOD: ${WORDCLOUD_METHOD:-count}
    volumes:
      - ./scrapers/nlp:/app
    command:
      - sh
      - -c
      - pip install --no-cache-dir -r requirements.txt && python sentiment.py && python wordcloud.py
    depends_on:
      mongodb:
        condition: service_healthy

  spark:
    build:
      context: .
      dockerfile: .docker/spark/Dockerfile
    container_name: homepedia-spark
    user: "airflow:0"
    command: ["tail", "-f", "/dev/null"]
    environment:
      - SPARK_MODE=local
      - HOME=/tmp
      - USER=airflow
      - LOGNAME=airflow
      - HADOOP_USER_NAME=airflow
      - SPARK_SUBMIT_OPTS=-Duser.home=/tmp
      - POSTGIS_HOST=${POSTGIS_HOST:-postgis}
      - POSTGIS_PORT=${POSTGIS_PORT:-${POSTGIS_PUBLISH_PORT:-5432}}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-homepedia}
      - DVF_LINK_PLOTS=${DVF_LINK_PLOTS:-1}
      - MONGODB_HOST=${MONGODB_HOST:-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-${MONGODB_PUBLISH_PORT:-27017}}
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./airflow/data:/opt/airflow/data
    depends_on:
      postgis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgis_data: {}
  mongo_data: {}
  airflow_postgres_data: {}
