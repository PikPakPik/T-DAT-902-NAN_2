services:
  postgis:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homepedia
    volumes:
      - postgis_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homepedia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: homepedia
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: .docker/node/Dockerfile
    command: sh -c "npm install && npm run start:dev"
    ports:
      - 3000:3000
    environment:
      NODE_ENV: development
      POSTGRES_URL: postgresql://postgres:postgres@postgis:5432/homepedia
      MONGODB_URL: mongodb://root:example@mongodb:27017/homepedia?authSource=admin
    volumes:
      - ./backend/:/usr/share/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build: .docker/node/Dockerfile
    command: sh -c "cd frontend && npm install && npm run start"
    ports:
      - 4200:4200
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend/:/usr/share/app
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgis_data: {}
  mongo_data: {}