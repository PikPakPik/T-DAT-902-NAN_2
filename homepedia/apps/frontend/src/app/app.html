<style>
    .main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  
    .content {
      background: light-dark(var(--p-surface-50), var(--p-surface-900));
      border-radius: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 2rem;
    }
  
    .content-input {
      display: flex;
      gap: 1rem;
    }
  
    .title {
      font-weight: 700;
      font-size: 1.25rem;
      text-align: center;
      width: 100%;
    }
  </style>
  
  <main class="main">
    <div class="content">
      <span class="title">PrimeNG Playground</span>
      <div class="content-apollo">
        <span class="title">Apollo Status</span>
        <p>{{ apolloStatus }}</p>
        <p>{{ apolloResult }}</p>
      </div>
      <div class="content-input">
        <input type="text" pInputText [(ngModel)]="text" />
        <p-button
          label="Submit"
          (onClick)="onClick()"
          [disabled]="!text"
        ></p-button>
      </div>
      @if (msg) {
        <p-message severity="success">{{ msg }}</p-message>
      }
    </div>
  </main>

  <div id="leaflet-map"></div>

  
  <router-outlet />
