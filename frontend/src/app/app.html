<header class="app-header">
  <div class="app-header__left">
    <span class="app-title">Homepedia</span>
    <div class="app-nav">
      <p-button
        label="Carte"
        icon="pi pi-map"
        [text]="true"
        (onClick)="navigate('/')"
      />
    </div>
  </div>

  <div class="app-header__right">
    <p-button
      type="button"
      [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="toggleDarkMode()"
      [attr.aria-label]="
        isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'
      "
    />
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
